id: 27
name: terraform-aws-baseline
program:
  id: delivery-observability-infra
  narrative_fit: Proves repeatable local infrastructure delivery, provider substitution, and source-locked provisioning evidence.
  shared_assets:
    - cloud adapter contract
    - Terraform module boundary
    - infrastructure benchmark harness
status: benchmarked
claim: One shared Terraform module provisions locally through Kumo and can target AWS by changing only the provider adapter.
stack: [terraform-1.15, aws-provider-5, kumo, python-3.12, docker, github-actions]
language_profile:
  primary: terraform
  secondary: [python]
  reason: Terraform owns infrastructure intent; Python orchestrates reproducible lifecycle evidence and contract validation.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: Docker contains pinned Terraform and Kumo binaries; no cloud account is required.
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: candidate-recorded
  principles:
    coupling_rule: Provider configuration belongs to adapters; all resource declarations belong to one shared module.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: Four resources prove storage, events, state, and logs without introducing a landing-zone platform.
    testability_rule: CI applies and destroys the local adapter, validates the AWS adapter statically, and locks evidence to source and image digests.
    rejected_overengineering:
      - Remote state because its backend and access policy are environment-specific.
      - IAM bootstrap and organization controls because they are outside the application-baseline claim.
      - Duplicated local resources because provider substitution is the behavior under proof.
  stack_profile: terraform
  api_style: cli
  messaging: sns
  cloud:
    mode: adapter-emulator
    local_provider: kumo-0.28.1
    real_provider_target: aws
    emulated_services: [s3, sns, dynamodb, cloudwatch-logs]
    adapter_rule: Both adapters use modules/application-baseline; only provider endpoint and credential behavior differ.
    config_switch: Select adapters/kumo for local execution or adapters/aws for real cloud.
    unsupported_behaviors:
      - Kumo results do not establish full AWS conformance.
      - The local benchmark does not measure AWS latency, billing, quotas, IAM, or eventual consistency.
      - S3 bucket tagging is excluded from the shared resource due to a documented Kumo 0.28.1 compatibility gap.
  database: dynamodb
  runtime: Terraform 1.15.8, AWS provider 5.100.0, Kumo 0.28.1, and Python 3.12.
  library_policy: Pin runtime image, emulator digest, provider lockfiles, and Python validation dependency.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: terraform_data fake
      reason: It proves configuration shape but not provider-level provisioning or adapter substitution.
    - option: LocalStack
      reason: Kumo is the portfolio-standard lightweight local-first emulator and supports the required APIs.
    - option: Separate local and AWS resource modules
      reason: Duplication would invalidate the substitution claim and create drift.
architecture:
  style: hexagonal
  reason: Provider configurations are outbound adapters around one shared infrastructure contract.
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: high
    throughput_or_async: low
    independent_deployability: medium
  dependency_rule: Adapters depend inward on the shared module; the shared module never references Kumo endpoints or credentials.
  boundaries:
    - modules/application-baseline owns cloud resource intent
    - adapters/kumo owns local endpoint and fake credential configuration
    - adapters/aws owns real provider configuration
    - benchmarks owns apply/destroy measurement and lifecycle assertions
  rejected_alternatives:
    - style: duplicated-environment-roots
      reason: It would let local and AWS declarations drift.
    - style: microservices
      reason: This repository delivers infrastructure composition, not a distributed application.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_table, architecture_graph, limitations_section]
  diagram_required: true
reuse:
  kit_version: local
  uses: [catalog, programs, component-packs, openspec-schema, decision-brain, agent-graph, cloud-local-first, architecture, language-profiles, sdd, harness, skills]
benchmark:
  primary_metric: kumo_apply_seconds
  unit: seconds
  command: python tools/benchmark_v2.py --image terraform-aws-baseline:local
  result_path: benchmarks/publication/27-kumo-provisioning-v2.json
release:
  docker: One non-root image embeds pinned Terraform and Kumo and defaults to full verification.
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
