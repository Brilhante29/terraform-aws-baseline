name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full evidence history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build pinned local-first harness
        run: docker build -t terraform-aws-baseline:ci .

      - name: Validate contracts and both adapters
        run: docker run --rm terraform-aws-baseline:ci validate

      - name: Reproduce Kumo provisioning benchmark
        run: |
          docker create --name benchmark terraform-aws-baseline:ci benchmark \
            --repeat 3 --warmup 1 \
            --output /output/27-kumo-provisioning-v1.json
          docker start -a benchmark
          docker cp benchmark:/output/27-kumo-provisioning-v1.json "$RUNNER_TEMP/27-kumo-provisioning-v1.json"
          docker rm benchmark
          python -m json.tool "$RUNNER_TEMP/27-kumo-provisioning-v1.json" >/dev/null

      - name: Set up publication validator
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate committed publication evidence
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python tools/validate-publication.py
